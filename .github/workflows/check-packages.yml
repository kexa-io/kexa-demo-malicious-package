name: Git Kexa Action

on:
  workflow_dispatch:
  push:
    branches:
      - main

  
jobs:
  verify-malicious-npm-pkg:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Run Kexa Action
        uses: kexa-io/git-action@1.8.6-stable
        id: kexa
        with:
          ENV_VARS: |
            GH1_GITHUBTOKEN=${{ secrets.GIT_TOKEN }}
            MYOWNRULES="./rules"
            NODE_CONFIG_TS_ENV=git

      - name: Check Kexa Action Result
        if: steps.kexa.outcome != 'success'
        run: |
          echo "Kexa Action failed with exit code $?. Exiting..."
          exit 1
